<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Risultati Gara Piloti - GT Style</title>
   <link rel="stylesheet" href="provatab.css"> <!-- Collegamento CSS -->


</head>
<body>

  
  <a href="pgacc.html" class="btnhome"></a>

  <div id="gareContainer"></div> <!-- Dove verranno inserite le tabelle -->

  <script>
    function msToTime(ms) {
      if (!ms || ms >= 2147483647) return 'N/A';
      const min = Math.floor(ms / 60000);
      const sec = Math.floor((ms % 60000) / 1000);
      const msec = ms % 1000;
      return `${min}:${sec.toString().padStart(2, '0')}.${msec.toString().padStart(3, '0')}`;
    }

    fetch('files.json')
      .then(res => res.json())
      .then(fileData => {
        const fileList = fileData.files;

        fileList.forEach(fileName => {
          fetch(fileName)
            .then(res => res.json())
            .then(data => {
              const container = document.getElementById('gareContainer');

              // Crea una sezione per la gara
              const section = document.createElement('section');
              section.classList.add('gara');

              // Titolo della sessione
              const title = document.createElement('h2');
              title.textContent = `Sessione: ${data.sessionType} - ${data.trackName} | Server: ${data.serverName}`;
              section.appendChild(title);

              // Crea tabella
              const table = document.createElement('table');
              table.innerHTML = `
                <thead>
                  <tr>
                    <th>Pos</th>
                    <th>Pilota</th>
                    <th>Numero</th>
                    <th>Auto</th>
                    <th class="bestlap">Best Lap</th>
                    <th class="totaltime">Tempo Totale</th>
                    <th class="giri">Giri</th>
                    <th class="pitstop">Pitstop</th>
                  </tr>
                </thead>
                <tbody></tbody>
              `;
              const tbody = table.querySelector('tbody');

              // Riempie la tabella con i dati
              const entries = data.sessionResult.leaderBoardLines;
              entries.forEach((entry, index) => {
                const driver = entry.currentDriver;
                const timing = entry.timing;
                const car = entry.car;

                const row = document.createElement('tr');
                row.innerHTML = `
                  <td class="position">${index + 1}</td>
                  <td>${driver.firstName.charAt(0)}. ${driver.lastName}</td>
                  <td>${car.raceNumber}</td>
                  <td>${car.carGroup}</td>
                  <td class="bestlap">${msToTime(timing.bestLap)}</td>
                  <td class="totaltime">${msToTime(timing.totalTime)}</td>
                  <td>${timing.lapCount}</td>
                  <td>${entry.missingMandatoryPitstop}</td>
                `;
                tbody.appendChild(row);
              });

              section.appendChild(table);
              container.appendChild(section);
            })
            .catch(err => console.error(`Errore nel caricamento di ${fileName}:`, err));
        });
      })
      .catch(err => console.error('Errore nel caricamento di files.json:', err));
  </script>
</body>
</html>

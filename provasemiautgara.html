<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Classifica F1</title>
 
 <style>
   
  body {
  background: #222;
  font-family: Arial, sans-serif;
  color: white;
  margin-left: 0;
  padding: 0;
  
}
 
  .row {
    border: solid 2px red none;
    display: flex;
    align-items: start;
    padding: 6px 12px;
    font-family: sans-serif;
    margin-left: 0px;
    gap: 10px;
  
  }

  .pos {
    background-color: red ;
    border: solid 2px white;
    width: 30px;
    font-weight: bold;
    text-align: center;
  }

  .driver {
    border: solid 2px gold none;
    width: 150px;
   padding-left: 0px;
  }

  .time {
    border: solid 2px red none;
    width:auto;
    text-align:start;
    padding-left:0px;
    
  }

  .gap{
     border: solid 2px red none;
    width:60px;
    text-align:start;
   color: red;
  }
  .laps{
     border: solid 2px red none;
    width: 120px;
    text-align:start;
    flex: 0;
    color: rgb(0, 162, 255);
  }

   .car{
    border: solid 2px gold none ;
    overflow: hidden;
    width: 250px;
    text-align:start;
    color: rgb(241, 241, 241);
  }
  

  .compound {
     border: solid 2px red none;
    background-color: #ddd;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    font-size: 0.85em;
  }

  .header {
    font-size: 18px;
    font-weight: bold;
    padding: 10px 12px;
    background: black;
    border-bottom: 2px solid #999;
  }

  #leaderboard {
    max-width: auto;
    max-height: auto;
    margin-left:  15px;
    margin-top: 100px;
    border: 1px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
   } .namerace{
    border: solid 2px red none;
    text-align: center;
    font-size: 20px;
    font-weight: bolder;
   }

</head>
<body>
 <a href="index.html"><button>HOME</button></a>

  <div id="leaderboard">
    <div class="header">LAP <strong>15</strong> / 70</div>
    <!-- Qui andrà la classifica -->
  </div>

  <script>
    fetch('files.json')
      .then(res => res.json())
      .then(files => {
        const container = document.getElementById('leaderboard');

        files.forEach(filename => {
          fetch(filename)
            .then(res => res.json())
            .then(data => {
              let html = `<h3 class="namerace">${filename}</h3>`; // Titolo sessione (facoltativo)

              data.sessionResult.leaderBoardLines.forEach(pilota => {
                html += `
                  <div class="row">
                    <div class="pos">${pilota.position}</div>
                    <div class="driver">${pilota.driverName}</div>
                    <div class="time">${pilota.bestLapTime}</div>
                        <div class="gap"> +${pilota.gap}</div>
                         <div class="laps"> laps${pilota.laps}</div>
                          <div class="car">${pilota.car}</div>
                    </div>
                  </div>
                `;
              });

              container.innerHTML += html;
            });
        });
      });
  </script>
</body>
</html>

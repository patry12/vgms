<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Classifica F1</title>
 
 <style>
   
  body {
  background: #222;
  width: auto;
  font-family: Arial, sans-serif;
  color: white;
  margin-left: 0;
  padding: 0;
  
}
 
  .row {
    border: solid 2px red none;
    display: flex;
    align-items: start;
    padding: 6px 12px;
    font-family: sans-serif;
    margin-left: 0px;
    gap: 10px;
  
  }

  .pos {
    background-color: red ;
    border: solid 2px white;
    width: 30px;
    font-weight: bold;
    text-align: center;
  }

  .driver {
    border: solid 2px gold none;
    width: 150px;
   padding-left: 0px;
  }

  .time {
    border: solid 2px red none;
    width:auto;
    text-align:start;
    padding-left:0px;
    
  }

  .gap{
     border: solid 2px red none;
    width:60px;
    text-align:start;
   color: red;
  }
  .laps{
     border: solid 2px red none;
    width: 120px;
    text-align:start;
    flex: 0;
    color: rgb(0, 162, 255);
  }

   .car{
    border: solid 2px gold none ;
    overflow: hidden;
    width: 250px;
    text-align:start;
    color: rgb(241, 241, 241);
  }
  

  .compound {
     border: solid 2px red none;
    background-color: #ddd;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    font-size: 0.85em;
  }

  .header {
    font-size: 18px;
    font-weight: bold;
    padding: 10px 12px;
    background: rgb(255, 0, 0);
    border-bottom: 2px solid #999;
  }

  #leaderboard {
    max-width: auto;
    max-height: auto;
    margin-left:  15px;
    margin-top: 100px;
    border: 1px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
   } .namerace{
    border: solid 2px red none;
    text-align: center;
    font-size: 20px;
    font-weight: bolder;
   } 
   .servernome{color: #ccc; width: 10vh;
     text-align: center; display: inline;
  border: solid 2px gold ; margin-left: 2%; position: absolute; margin-top: -50px;}
.trackName{border: solid 2px blue none; width: 10%; overflow: hidden;}
.sessiontype{border: solid 2px white none; width: 10%; position:absolute; overflow: hidden; display: inline;}
  .penalty{border: solid 2px green none ; text-align: start; color: orange;
    position: absolute; width: 145px; height: 20px; margin-left:65%;  }
    .best{border: solid 2px gold none; width: 20%; text-align:start; margin-left: 35%;
       position:relative; color: rgb(238, 10, 238); animation: best 2s infinite;}
       
       @keyframes best {
        0% {color: violet;}
        100% {color: transparent;}
       }

      /* .penalty_name{ border : solid 2px gold;  color: red; margin-left: 95%; position: absolute;}*/
       .penalty_Type{border :solid 2px green none; color: red; margin-left: 79%; position: absolute; }

</head>
<body>
 <a href="index.html"><button>HOME</button></a>

  <div id="leaderboard">
    <div class="header"></div>
    <div class=""></div>
    <!-- Qui andrà la classifica -->
  </div>

  <script>
    fetch('files.json')
      .then(res => res.json())
      .then(files => {
        const container = document.getElementById('leaderboard');

        files.forEach(filename => {
          fetch(filename)
            .then(res => res.json())
            .then(data => {
              let html = `<h3 class="namerace">${filename}</h3> 
                 <h3 class="serverName">${data.serverName}</h3> `;
     
     /* <h3 class="sessiontype">${data.sessionType}</h3>*/
    /* <h3 class="best"> Best Lap  ${data.sessionResult.bestLap}<h3>*/            
            
                data.sessionResult.leaderBoardLines.forEach(pilota => {

                   const penaltyData = data.penalties?.find(p => p.carId === pilota.carId);
                html += `
                  <div class="row">
              
                    <div class="pos">${pilota.position}</div>
                    <div class="driver">${pilota.driverName}</div>
                    <div class="time">${pilota.bestLapTime}</div>
                        <div class="gap"> +${pilota.gap}</div>
                         <div class="laps"> laps${pilota.laps}</div>
                          <div class="car">${pilota.car}</div>
                          <div class="penalty">+${pilota.penaltiesTime} s penalty </div>
                          <div class="penalty_Type">${penaltyData ? penaltyData.penaltyType : ""}</div>
                           </div>
                 `;
                 
     /* <div class="penalty_name">${penaltyData ? penaltyData.reason : ""}</div>*/

                 
    
 
              });

              container.innerHTML += html;
            });
        });
      });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Classifica F1</title>
  <style>
    body {
      background: #222;
      font-family: Arial, sans-serif;
      color: white;
      margin: 0;
      padding: 0;
    }

    .row {
      display: flex;
      align-items: start;
      padding: 6px 12px;
      gap: 10px;
    }

    .pos {
      background-color: red;
      border: 2px solid white;
      width: 30px;
      font-weight: bold;
      text-align: center;
    }

    .driver {
      width: 150px;
    }

    .time {
      width: auto;
      text-align: start;
    }

    .gap {
      width: 60px;
      text-align: start;
      color: red;
    }

    .laps {
      width: 120px;
      text-align: start;
      color: rgb(0, 162, 255);
    }

    .car {
      width: 250px;
      text-align: start;
      color: rgb(241, 241, 241);
    }

    .penalty {
      color: orange;
      width: 145px;
      margin-left: auto;
    }

    .penalty_Type {
      color: red;
      margin-left: auto;
    }

    .header {
      font-size: 18px;
      font-weight: bold;
      padding: 10px 12px;
      background: rgb(255, 0, 0);
      border-bottom: 2px solid #999;
    }

    #leaderboard {
      margin-left: 15px;
      margin-top: 100px;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }

    .namerace {
      text-align: center;
      font-size: 20px;
      font-weight: bolder;
    }

    .serverName {
      color: #ccc;
      text-align: center;
      margin-bottom: 10px;
    }

    #home, #classifica {
      width: 10%;
      height: 2%;
      position: absolute;
      color: white;
      background-color: #222;
      border: 1px solid #ccc;
      font-weight: bolder;
      top: 15px;
    }

    #home {
      left: 40%;
    }

    #classifica {
      left: 52%;
    }
  </style>
</head>
<body>

  <a href="index.html"><button id="home">HOME</button></a>
  <a href="classifica.html"><button id="classifica">CLASSIFICA</button></a>

  <div id="leaderboard">
    <div class="header">Classifica Gara</div>
  </div>

  <script>
    // Funzione per formattare tempo in ms (se serve)
    function formatTime(ms) {
      if (!ms || ms <= 0) return "-";
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = ms % 1000;
      return `${minutes}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
    }

    fetch('files.json')
      .then(res => res.json())
      .then(files => {
        const container = document.getElementById('leaderboard');

        files.forEach(filename => {
          fetch(filename)
            .then(res => res.json())
            .then(data => {
             let html = `
                <h3 class="namerace">${filename.replace('.json', '').toUpperCase()}</h3>
                <h4 class="serverName">${data.serverName || "Nome server non disponibile"}</h4>
              `;

              data.sessionResult.leaderBoardLines.forEach(pilota => {
                const penaltyData = data.penalties?.find(p => p.carId === pilota.car.carId);

                const nomePilota = pilota.driverName || "Nome non disponibile";

               const bestLapTime = typeof pilota.timing.bestLap === 'number'
                  ? formatTime(pilota.timing.bestLap)
                  : pilota.timing.bestLap || "-";

                const gap = typeof pilota.timing.gap === 'number'
                  ? formatTime(pilota.timing.gap)
                  : pilota.timing.gap || "-";

                const laps = pilota.timing?.laps ?? "-";
                const car = pilota.car.teamName || pilota.car.carModel || "Auto sconosciuta";
                const penaltiesTime = pilota.penalties || 0;
                const penaltyType = penaltyData ? penaltyData.penaltyType : "";

                html += `
                  <div class="row">
                    <div class="pos">${pilota.position}</div>
                    <div class="driver">${nomePilota}</div>
                    <div class="time">${bestLapTime}</div>
                    <div class="gap">+${gap}</div>
                    <div class="laps">laps ${laps}</div>
                    <div class="car">${car}</div>
                    <div class="penalty">+${penaltiesTime}s penalty</div>
                    <div class="penalty_Type">${penaltyType}</div>
                  </div>
                `;
              });

              container.innerHTML += html;
            })
            .catch(err => {
              console.error(`Errore caricando il file ${filename}:`, err);
              container.innerHTML += `<p style="color:red">Errore caricando ${filename}</p>`;
            });
        });
      })
      .catch(err => {
        console.error("Errore nel caricamento di files.json:", err);
        document.getElementById('leaderboard').innerHTML = "<p style='color:red'>Errore nel caricamento dei file</p>";
      });
  </script>
</body>
</html>
